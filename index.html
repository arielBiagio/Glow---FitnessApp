<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/apple-touch-icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- iOS / PWA Mobile App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GLOW Cele" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.jpg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- SEO Optimization -->
    <title>GLOW Cele — Bio-Performance Tracker</title>
    <meta name="description" content="Sistema de entrenamiento y seguimiento de hipertrofia y acondicionamiento." />

    <!-- Google Fonts for Preset D (Vapor Clinic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#07070E] text-[#F0EFF4] selection:bg-[#7B61FF] selection:text-white font-sans antialiased overflow-x-hidden">
    <!-- Visual Texture: Global CSS noise overlay using feTurbulence -->
    <svg class="pointer-events-none fixed inset-0 z-50 h-full w-full opacity-6 select-none" style="mix-blend-mode: overlay;" aria-hidden="true">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" />
      </filter>
      <rect width="100%" height="100%" filter="url(#noise)" />
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
